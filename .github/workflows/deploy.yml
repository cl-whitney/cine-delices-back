name: deploy-cinedelices

on:
  push:
    branches:
      - main

jobs:
    build-and-test:
        runs-on: unbuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v4

              # Setup pnpm
            - name: Install pnpm
              uses: pnpm/action-setup@v2
              with:
                version: 10
                run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                node-version: '20'
                cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Setup Biome
              uses: biome/biome-action@v1
              with:
                biome_version: 'latest'

            - name: Run Biome
              run: biome ci .

            - name: Build
              run: pnpm build

            - name: Verify build
              run: ls dist

            - name: Setup Surge
              run: npm install -g surge

            - name: Deploy to Surge
              run: surge ./dist ${{ secrets.SURGE_DOMAIN }} --token ${{ secrets.SURGE_TOKEN }}